Active_gNBs:
  - gnb-du-rfsim
Asn1_verbosity: none

gNBs:
  - gNB_ID: 0xe00
    gNB_DU_ID: 0xe00
    gNB_name: gnb-du-rfsim
    disable_harq: 0
    tracking_area_code: 81
    # UE-specific search space (UESS) PDCCH candidates per aggregation level.
    # Order: [L1, L2, L4, L8, L16]. Max for ~34-CCE CORESET (106 PRB, duration 2):
    # L8 capped at 4 (8*8>34), L16 capped at 2 (8*16>34).
    uess_agg_levels: [8, 8, 8, 4, 2]
    # CORESET duration in OFDM symbols (1, 2 or 3). Use 2 for all slice experiments.
    coreset_duration: 2
    plmn_list:
      - mcc: 001
        mnc: 01
        mnc_length: 2
        snssaiList:
          - sst: 1
            sd: 0xffffff
          - sst: 1
            sd: 0x01
          - sst: 1
            sd: 0x02
          - sst: 1
            sd: 0x03
    nr_cellid: 12345678
    min_rxtxtime: 6
    servingCellConfigCommon:
      - physCellId: 0
        absoluteFrequencySSB: 621312
        dl_absoluteFrequencyPointA: 620040
        dl_subcarrierSpacing: 1
        dl_carrierBandwidth: 106
        initialDLBWPlocationAndBandwidth: 28875
        initialDLBWPsubcarrierSpacing: 1
        initialDLBWPcontrolResourceSetZero: 11
        initialDLBWPsearchSpaceZero: 0
        ul_frequencyBand: 78
        ul_subcarrierSpacing: 1
        ul_carrierBandwidth: 106
        pMax: 20
        initialULBWPlocationAndBandwidth: 28875
        initialULBWPsubcarrierSpacing: 1
        prach_ConfigurationIndex: 98
        prach_msg1_FDM: 0
        prach_msg1_FrequencyStart: 0
        zeroCorrelationZoneConfig: 12
        preambleReceivedTargetPower: -104
        preambleTransMax: 6
        powerRampingStep: 1
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR: 4
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB: 15
        ra_ContentionResolutionTimer: 7
        rsrp_ThresholdSSB: 19
        prach_RootSequenceIndex_PR: 2
        prach_RootSequenceIndex: 1
        msg1_SubcarrierSpacing: 1
        restrictedSetConfig: 0
        msg3_DeltaPreamble: 1
        p0_NominalWithGrant: -90
        pucchGroupHopping: 0
        hoppingId: 40
        p0_nominal: -90
        ssb_periodicityServingCell: 2
        referenceSubcarrierSpacing: 1
        dl_UL_TransmissionPeriodicity: 6
        nrofDownlinkSlots: 7
        nrofDownlinkSymbols: 6
        nrofUplinkSlots: 2
        nrofUplinkSymbols: 6
        ssPBCH_BlockPower: -25
    SCTP:
      SCTP_INSTREAMS: 2
      SCTP_OUTSTREAMS: 2

MACRLCs:
  - num_cc: 1
    tr_s_preference: local_L1
    tr_n_preference: f1
    local_n_address: 192.168.202.140
    remote_n_address: 192.168.202.141
    local_n_portd: 2153
    remote_n_portd: 2153
    pusch_TargetSNRx10: 200
    pucch_TargetSNRx10: 200
    stats_max_ue: 17
    dl_scheduler_type: 1
    ul_scheduler_type: 1

Slices:
  - slice_id: 0
    sst: 1
    sd: 0xffffff
    dedicated_prb_ratio: 0.0
    min_prb_ratio: 0.0
    max_prb_ratio: 100.0
  - slice_id: 1
    sst: 1
    sd: 0x000001
    dedicated_prb_ratio: 0.0
    min_prb_ratio: 0.0
    max_prb_ratio: 100.0
  - slice_id: 2
    sst: 1
    sd: 0x000002
    dedicated_prb_ratio: 0.0
    min_prb_ratio: 0.0
    max_prb_ratio: 100.0
  - slice_id: 3
    sst: 1
    sd: 0x000003
    dedicated_prb_ratio: 0.0
    min_prb_ratio: 0.0
    max_prb_ratio: 50.0

L1s:
  - num_cc: 1
    tr_n_preference: local_mac
    prach_dtx_threshold: 200

RUs:
  - local_rf: yes
    nb_tx: 1
    nb_rx: 1
    att_tx: 0
    att_rx: 0
    bands: [78]
    max_pdschReferenceSignalPower: -27
    max_rxgain: 75
    eNB_instances: [0]
    sf_extension: 0
    sdr_addrs: serial=XXXXXXX

rfsimulator:
  serveraddr: server

log_config:
  global_log_level: info
  hw_log_level: info
  phy_log_level: info
  mac_log_level: info
  rlc_log_level: info
  pdcp_log_level: info
  rrc_log_level: info
  f1ap_log_level: debug

e2_agent:
  near_ric_ip_addr: 192.168.201.142
  sm_dir: /usr/local/lib/flexric/
