# FlexRIC connection settings (nearRT-RIC + xApp)
# Used by: nws-nearRT-RIC container, host Python xApps (via FLEXRIC_CONF).
#
# Docker (nws-oai-rf-sim): nearRT-RIC listens on 192.168.201.142:36422
# gNB E2 agent must use the same IP in gNB YAML: e2_agent.near_ric_ip_addr

[NEAR-RIC]
# IPv4 where nearRT-RIC binds (must match docker-compose nws-nearRT-RIC ipv4_address)
NEAR_RIC_IP = 192.168.201.142

[XAPP]
# xApp SQLite / indication cache directory (trailing slash required)
DB_DIR = /tmp/
# Optional per-xApp DB file name (default used if omitted)
DB_NAME = xapp_db

# E2 SCTP port is fixed in FlexRIC (36422); not configurable via this file.
