# Slice xApp (monitor + REST) — host network.
#
# Prerequisites:
#   - oai-flexric:latest (nws/build_scripts/build_oai_flexric.sh)
#   - nws-nearRT-RIC already running (bringup.py / RAN compose) at 192.168.201.142
#   - gNB YAML e2_agent.near_ric_ip_addr = 192.168.201.142
#
# Usage:
#   cd nws/scripts/xapp
#   docker compose up --build
#   curl -s http://127.0.0.1:18080/api/v1/slices | jq .
#   # Lab LAN (this host): http://10.1.132.13:18080/docs  (not .200)

services:
  nws-xapp-slice-monitor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FLEXRIC_IMAGE: ${FLEXRIC_IMAGE:-oai-flexric:latest}
    image: nws-xapp:latest
    container_name: nws-xapp-slice-monitor
    network_mode: host
    environment:
      PYTHONPATH: /usr/local/flexric/xApp/python3
      LD_LIBRARY_PATH: /usr/local/lib:/flexric/build/src/xApp
      FLEXRIC_CONF: /usr/local/etc/flexric/flexric.conf
      NWS_XAPP_IN_DOCKER: "1"
      NEAR_RIC_IP: ${NEAR_RIC_IP:-192.168.201.142}
      NWS_XAPP_API_HOST: "0.0.0.0"
      NWS_XAPP_API_PORT: "${XAPP_API_HOST_PORT:-18080}"
    volumes:
      - ../../configs/flexric/flexric.conf:/usr/local/etc/flexric/flexric.conf:ro
      - ./out:/xapp/out
      - ./xapp_slice.py:/xapp/xapp_slice.py:ro
      - ./slice_gui.html:/xapp/slice_gui.html:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    stdin_open: true
    tty: true
    restart: "no"
