apiVersion: apps/v1
kind: Deployment
metadata:
  name: nws-rapp
  namespace: nonrtric
  labels:
    app: nws-rapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nws-rapp
  template:
    metadata:
      labels:
        app: nws-rapp
    spec:
      containers:
      - name: nws-rapp
        image: python:3.11-slim
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "/rapp/entrypoint.sh"]
        env:
        - name: NWS_RAPP_API_HOST
          value: "0.0.0.0"
        - name: NWS_RAPP_API_PORT
          value: "18090"
        - name: NWS_RAPP_UI_PORT
          value: "18091"
        - name: NWS_A1_PMS_BASE
          value: "http://policymanagementservice.nonrtric:8081/a1-policy-management/v1"
        - name: NWS_A1_RIC_ID
          value: "nearrt-ric"
        - name: NWS_A1_POLICY_TYPE_ID
          value: "20008"
        - name: NWS_XAPP_API_BASE
          value: "http://nws-xapp.ricxapp:18080"
        ports:
        - name: api
          containerPort: 18090
        - name: ui
          containerPort: 18091
        volumeMounts:
        - name: app-code
          mountPath: /rapp
      volumes:
      - name: app-code
        hostPath:
          path: /home/fcp/smo/osc-non-rt-ric/nonrtric-rapps/rapp-network-slicing/nws/app_rapp
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: nws-rapp
  namespace: nonrtric
  labels:
    app: nws-rapp
spec:
  type: NodePort
  selector:
    app: nws-rapp
  ports:
  - name: api
    port: 18090
    targetPort: 18090
    nodePort: 31090
  - name: ui
    port: 18091
    targetPort: 18091
    nodePort: 31091
