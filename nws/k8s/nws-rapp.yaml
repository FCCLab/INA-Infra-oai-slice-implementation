apiVersion: apps/v1
kind: Deployment
metadata:
  name: nws-rapp
  namespace: nonrtric
  labels:
    app: nws-rapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nws-rapp
  template:
    metadata:
      labels:
        app: nws-rapp
    spec:
      containers:
      - name: nws-rapp
        image: 10.1.110.84:5000/nws-rapp:latest
        imagePullPolicy: Always
        env:
        - name: NWS_RAPP_API_HOST
          value: "0.0.0.0"
        - name: NWS_RAPP_API_PORT
          value: "18090"
        - name: NWS_RAPP_UI_PORT
          value: "18091"
        - name: NWS_A1_PMS_BASE
          value: "http://policymanagementservice.nonrtric:8081/a1-policy-management/v1"
        - name: NWS_A1_RIC_ID
          value: "nearrt-ric-remote"
        - name: NWS_A1_POLICY_TYPE_ID
          value: "20008"
        - name: NWS_XAPP_API_BASE
          value: "http://10.1.101.108:31080"
        - name: NWS_RAPP_STORE
          value: "/rapp/out/rapp_store.json"
        ports:
        - name: api
          containerPort: 18090
        - name: ui
          containerPort: 18091
        volumeMounts:
        - name: rapp-out
          mountPath: /rapp/out
      volumes:
      - name: rapp-out
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nws-rapp
  namespace: nonrtric
  labels:
    app: nws-rapp
spec:
  type: NodePort
  selector:
    app: nws-rapp
  ports:
  - name: api
    port: 18090
    targetPort: 18090
    nodePort: 31090
  - name: ui
    port: 18091
    targetPort: 18091
    nodePort: 31091
