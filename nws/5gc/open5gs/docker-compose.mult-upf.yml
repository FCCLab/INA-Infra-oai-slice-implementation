#
# Multi-UPF Open5GS 5GC for --split-mult-upf-cuup.
# 5x open5gs-upfd (DNN oai1..oai5, N3 10.53.1.3..7) + monolithic 5gc (no_upf).
#
services:
  nws-5gc:
    container_name: nws-5gc
    build:
      context: open5gs
      target: open5gs
      args:
        OS_VERSION: "22.04"
        OPEN5GS_VERSION: "v2.7.0"
    env_file:
      - ${OPEN_5GS_ENV_FILE:-open5gs/open5gs.env}
    environment:
      SUBSCRIBER_DB: subscriber_db_mult.csv
    privileged: true
    ports:
      - "29999:9999/tcp"
    entrypoint: ["./open5gs_entrypoint_mult.sh"]
    command: ["5gc", "-c", "/open5gs/open5gs-5gc.yml"]
    volumes:
      - ./open5gs/open5gs-5gc-mult.yml.in:/open5gs/open5gs-5gc-mult.yml.in:ro
      - ./open5gs/upf1.yml.in:/open5gs/upf1.yml.in:ro
      - ./open5gs/upf2.yml.in:/open5gs/upf2.yml.in:ro
      - ./open5gs/upf3.yml.in:/open5gs/upf3.yml.in:ro
      - ./open5gs/upf4.yml.in:/open5gs/upf4.yml.in:ro
      - ./open5gs/upf5.yml.in:/open5gs/upf5.yml.in:ro
      - ./open5gs/open5gs_entrypoint_mult.sh:/open5gs/open5gs_entrypoint_mult.sh:ro
      - ./open5gs/subscriber_db_mult.csv:/open5gs/subscriber_db_mult.csv:ro
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.20 7777" ]
      interval: 3s
      timeout: 1s
      retries: 60
    networks:
      nws-n2n3:
        ipv4_address: ${OPEN5GS_IP:-10.53.1.2}
      nws-n6:
        ipv4_address: ${N6_IP:-10.47.0.2}

networks:
  nws-n2n3:
    driver: bridge
    name: nws-n2n3
    driver_opts:
      com.docker.network.bridge.name: nws-n2n3
    ipam:
      driver: default
      config:
        - subnet: 10.53.1.0/24
  nws-n6:
    driver: bridge
    name: nws-n6
    driver_opts:
      com.docker.network.bridge.name: nws-n6
    ipam:
      driver: default
      config:
        - subnet: 10.47.0.0/24
