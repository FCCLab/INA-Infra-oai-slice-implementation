networks:
    nws-n2n3:
        external: true
        name: nws-n2n3
    nws-oai-rf-sim:
        driver: bridge
        name: nws-oai-rf-sim
        ipam:
            config:
                - subnet: 192.168.201.0/24
        driver_opts:
            com.docker.network.bridge.name: "nws-oai-rf-sim"
