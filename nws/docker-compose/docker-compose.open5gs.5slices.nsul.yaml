services:
    nws-nearRT-RIC:
        build:
            context: ../../openairinterface5g/openair2/E2AP/flexric
            dockerfile: docker/Dockerfile.flexric.ubuntu
        image: oai-flexric:latest
        container_name: nws-nearRT-RIC
        working_dir: /tmp
        user: "${UID:-1000}:${GID:-1000}"
        cap_drop:
            - ALL
        cap_add:
            - NET_ADMIN  # for network operations
            - NET_RAW    # for network operations
        environment:
            E2AP_VERSION: ${E2AP_VERSION:-E2AP_V3}
            KPM_VERSION: ${KPM_VERSION:-KPM_V3_00}
            ASAN_OPTIONS: detect_leaks=0
        depends_on:
            - nws-oai-gnb
        networks:
            nws-oai-rf-sim:
                ipv4_address: 192.168.201.142
        volumes:
            - ../configs/flexric/flexric.conf:/usr/local/etc/flexric/flexric.conf
        healthcheck:
            test: /bin/bash -c "pgrep nearRT-RIC"
            start_period: 10s
            start_interval: 500ms
            interval: 10s
            timeout: 5s
            retries: 5

    nws-oai-gnb:
        build:
            context: ../../openairinterface5g
            dockerfile: docker/Dockerfile.gNB.ubuntu
        image: oai-gnb:latest
        container_name: nws-oai-gnb
        ipc: host
        user: "0:0"
        cap_drop:
            - ALL
        cap_add:
            - SYS_NICE
            - NET_ADMIN  # for interface bringup
            - NET_RAW    # for ping
        environment:
            USE_ADDITIONAL_OPTIONS: -E --rfsim --log_config.global_log_options level,nocolor,time
            ASAN_OPTIONS: detect_leaks=0
            GNB_LOG_FILE: /workspace/log/gnb.log
            # Toggle slot-allocation export for resource-grid-visualizer.
            ENABLE_RESOURCE_GRID_VISUALIZATION: ${ENABLE_RESOURCE_GRID_VISUALIZATION:-0}
            # Share FAPI slot POSIX mq names with resource-grid-visualizer backend-dl/backend-ul.
            FAPI_MQ_PATH_DL: ${FAPI_MQ_PATH_DL:-/fapi_dl}
            FAPI_MQ_PATH_UL: ${FAPI_MQ_PATH_UL:-/fapi_ul}
        networks:
            nws-n2n3:
                ipv4_address: 10.53.1.140
            nws-oai-rf-sim:
                ipv4_address: 192.168.201.140
        devices:
            - /dev/net/tun:/dev/net/tun
        volumes:
            - ../configs/gnb/gnb.sa.band78.106prb.rfsim.open5gs.5slices.nsul.yaml:/opt/oai-gnb/etc/gnb.yaml
            - ../log:/opt/oai-gnb/log
        healthcheck:
            test: /bin/bash -c "pgrep nr-softmodem"
            start_period: 10s
            start_interval: 500ms
            interval: 10s
            timeout: 5s
            retries: 5
        ports:
            - "19090:9090"

    nws-oai-nr-ue1:
        build:
            context: ../../openairinterface5g
            dockerfile: docker/Dockerfile.nrUE.ubuntu
        image: oai-nr-ue:latest
        container_name: nws-oai-nr-ue1
        environment:
            USE_ADDITIONAL_OPTIONS: -E -r 106 --numerology 1 -C 3319680000 --rfsim --log_config.global_log_options level,nocolor,time --rfsimulator.serveraddr 192.168.201.140
            ASAN_OPTIONS: detect_leaks=0
        privileged: true
        cap_drop:
            - ALL
        cap_add:
            - NET_ADMIN  # for interface bringup
            - NET_RAW    # for ping
            - SYS_NICE
        depends_on:
            - nws-oai-gnb
        networks:
            nws-oai-rf-sim:
                ipv4_address: 192.168.201.150
        devices:
            - /dev/net/tun:/dev/net/tun
        volumes:
            - ../configs/ue/nrue1.uicc.yaml:/opt/oai-nr-ue/etc/nr-ue.yaml
        healthcheck:
            test: /bin/bash -c "pgrep nr-uesoftmodem"
            start_period: 10s
            start_interval: 500ms
            interval: 10s
            timeout: 5s
            retries: 5

    nws-oai-nr-ue2:
